[env]
# https://android.googlesource.com/platform/external/jemalloc_new/+/refs/heads/master/TUNING.md
JEMALLOC_SYS_WITH_MALLOC_CONF = "percpu_arena:percpu,oversize_threshold:0,background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000"

## If you are using aarch64-apple-darwin, you may need to set the following:
## JEMALLOC_SYS_WITH_LG_PAGE = "14"
## JEMALLOC_SYS_WITH_MALLOC_CONF = "oversize_threshold:0,dirty_decay_ms:5000,muzzy_decay_ms:5000"

[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-flto=thin"]

# Parallel rustc frontend. Databend's largest crates (databend-query, databend-common-functions,
# databend-common-ast) sit on the critical path of a clean build and are frontend-bound; this
# cuts a clean debug build by ~14% on a 24-core machine. Rustflags from all matching
# `target.<cfg>` tables are joined, so this applies on every platform.
[target.'cfg(all())']
rustflags = ["-Zthreads=8"]
