[package]
name = "databend-common-license"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
edition = { workspace = true }

[dependencies]
databend-common-base = { workspace = true }
databend-common-exception = { workspace = true }
display-more = { workspace = true }
jwt-simple = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The query build turns on `serde_json/arbitrary_precision` through `jsonb`,
# which changes how JSON numbers reach custom deserializers. Enable it here so
# these tests exercise the same configuration the query binary runs with.
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[lints]
workspace = true
