matrix: group_by_alias
local_dimensions:
  - name: relation
    values: [input-conflict, no-input, input-ambiguous]
  - name: alias_items
    values: [duplicate-same-form, duplicate-same-unmatched-form, duplicate-different-form]
  - name: alias_form
    values: [explicit, implicit]
  - name: key_side
    values: [input-column, alias-item]
  - name: clause
    values: [select-list, having, order-by]
  - name: position
    values: [in-range, after-star, zero, past-end]
regions:
  - description: bare GROUP BY names bind input columns first and fall back to SELECT scalar aliases
    main:
      consumers: [G0]
      name_shapes: [N0]
      producers: [S1]
    local:
      relation: [input-conflict, no-input, input-ambiguous]
    cases:
      - key: G0N0S1_0_0
        name: group_by_bare_select_alias_conflict_uses_input
        setup_sqls:
          - "CREATE TABLE t(i Int32, x Int32)"
        runs:
          - sql: "SELECT i AS x, count(*) FROM t GROUP BY x"
      - key: G0N0S1_0_1
        name: group_by_bare_select_alias_no_input
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, count(*) FROM t GROUP BY k"
      - key: G0N0S1_0_2
        name: group_by_bare_select_alias_ambiguous_input_rejected
        setup_sqls:
          - "CREATE TABLE t(x Int32)"
        runs:
          - sql: "SELECT t1.x AS x, count(*) FROM t AS t1 INNER JOIN t AS t2 ON true GROUP BY x"
  - description: grouping constructs resolve names as GROUP BY does, in every grouping set alike
    main:
      consumers: [G1, G3]
      name_shapes: [N2]
      producers: [S1]
    cases:
      - key: G1N2S1_1_
        name: grouping_sets_separate_set_falls_back_to_select_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, abs(i) AS ak, count(*) FROM t GROUP BY GROUPING SETS ((k), (abs(k)))"
      - key: G3N2S1_1_
        name: cube_generated_set_falls_back_to_select_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, abs(i) AS ak, count(*) FROM t GROUP BY CUBE(k, abs(k))"
  - description: complex GROUP BY expressions bind input columns first and fall back to SELECT scalar aliases only for unresolved names
    main:
      consumers: [G0]
      name_shapes: [N2]
      producers: [S1]
    local:
      relation: [input-conflict, no-input, input-ambiguous]
    cases:
      - key: G0N2S1_2_0
        name: group_by_complex_select_alias_conflict_uses_input
        setup_sqls:
          - "CREATE TABLE t(i Int32, k Int32)"
        runs:
          - sql: "SELECT 1 AS k, count(*) FROM t GROUP BY k + 1"
      - key: G0N2S1_2_1
        name: group_by_complex_select_alias_no_input_fallback
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT 1 AS k, count(*) FROM t GROUP BY k + 1"
      - key: G0N2S1_2_2
        name: group_by_complex_select_alias_ambiguous_input_rejected
        setup_sqls:
          - "CREATE TABLE t(k Int32)"
        runs:
          - sql: "SELECT 1 AS k, count(*) FROM t AS t1 INNER JOIN t AS t2 ON true GROUP BY k + 1"
  - description: a bare GROUP BY alias of several SELECT items is all of them if they have the same form, whether or not that form is matched to keys, and ambiguous otherwise
    main:
      consumers: [G0]
      name_shapes: [N0]
      producers: [S1]
    local:
      relation: [no-input]
      alias_items: [duplicate-same-form, duplicate-same-unmatched-form, duplicate-different-form]
    cases:
      - key: G0N0S1_3_10
        name: group_by_alias_of_duplicate_items_is_those_items
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a + 1 AS x, a + 1 AS x, count(*) FROM t GROUP BY x"
      - key: G0N0S1_3_11
        name: group_by_alias_of_duplicate_unmatched_items_is_those_items
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT array_transform([a], v -> v + 1) AS x, array_transform([a], v -> v + 1) AS x, count(*) FROM t GROUP BY x"
      - key: G0N0S1_3_12
        name: group_by_alias_of_different_items_is_ambiguous
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a AS x, b AS x, count(*) FROM t GROUP BY x"
  - description: GROUP BY sees only explicit SELECT aliases, not the implicit names of unaliased items
    main:
      consumers: [G0]
      name_shapes: [N0]
      producers: [S1]
    local:
      alias_form: [implicit]
    cases:
      - key: G0N0S1_4_1
        name: group_by_implicit_item_name_is_not_an_alias
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a + 1, count(*) FROM t GROUP BY \"a + 1\""
  - description: GROUP BY references to aggregate SELECT aliases distinguish conflict from no-input legality
    main:
      consumers: [G0]
      name_shapes: [N0]
      producers: [S2]
    local:
      relation: [input-conflict, no-input]
    cases:
      - key: G0N0S2_5_0
        name: group_by_aggregate_alias_conflict_uses_input
        setup_sqls: []
        runs:
          - sql: "SELECT count(*) AS x FROM (SELECT 1 AS x UNION ALL SELECT 2 AS x) GROUP BY x"
      - key: G0N0S2_5_1
        name: group_by_aggregate_alias_no_input_rejected
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT count(*) AS c FROM t GROUP BY c"
  - description: GROUP BY references to SRF SELECT aliases distinguish conflict from alias fallback
    main:
      consumers: [G0]
      name_shapes: [N0]
      producers: [S4]
    local:
      relation: [input-conflict, no-input]
    cases:
      - key: G0N0S4_6_0
        name: group_by_srf_alias_conflict_uses_input
        setup_sqls:
          - "CREATE TABLE t_str(col1 String, col2 String)"
        runs:
          - sql: "SELECT t.col1 AS col1, unnest(split(t.col2, ',')) AS col2 FROM t_str AS t GROUP BY col1, col2 ORDER BY col2"
      - key: G0N0S4_6_1
        name: group_by_srf_alias_no_input
        setup_sqls:
          - "CREATE TABLE t_str(col1 String, col2 String)"
        runs:
          - sql: "SELECT t.col1 AS col1, unnest(split(t.col2, ',')) AS col3 FROM t_str AS t GROUP BY col1, col3 ORDER BY col3"
  - description: qualified GROUP BY names included to document why they are outside alias lookup
    main:
      consumers: [G0]
      name_shapes: [N1]
      producers: [S1]
    local:
      relation: [no-input]
    masks:
      - when:
          main:
            name_shapes: [N1]
          local:
            relation: [no-input]
        reason: qualified GROUP BY names bypass SELECT output aliases and belong to relation-name resolution
  - description: ordinal GROUP BY syntax included to document why producer-kind legality does not apply
    main:
      consumers: [G0]
      name_shapes: [N4]
      producers: [S2]
    local:
      relation: [no-input]
    masks:
      - when:
          main:
            name_shapes: [N4]
          local:
            relation: [no-input]
        reason: ordinal GROUP BY syntax does not consume alias names, so producer kind legality is irrelevant
  - description: GROUP BY ordinal references consume one-based SELECT-item positions, counting the columns a star expands to, rather than alias names
    main:
      consumers: [G0]
      name_shapes: [N4]
      producers: [N0]
    local:
      position: [in-range, after-star, zero, past-end]
    cases:
      - key: G0N4N0_9_0
        name: group_by_ordinal_uses_select_item_position
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, count(*) FROM t GROUP BY 1"
      - key: G0N4N0_9_1
        name: group_by_ordinal_counts_star_columns
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a, *, count(*) FROM t GROUP BY 1, 3"
      - key: G0N4N0_9_2
        name: group_by_ordinal_zero_rejected
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a, count(*) FROM t GROUP BY 0"
      - key: G0N4N0_9_3
        name: group_by_ordinal_past_select_list_rejected
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT *, count(*) FROM t GROUP BY 1, 2, 4"
  - description: GROUP BY ALL expands non-aggregate SELECT items without resolving a user-written alias name
    main:
      consumers: [G5]
      name_shapes: [N5]
      producers: [N0]
    cases:
      - key: G5N5N0_10_
        name: group_by_all_expands_non_aggregate_select_items
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, count(*) FROM t GROUP BY ALL"
  - description: grouping() arguments resolve a bare name as GROUP BY does in every clause, an input column first and otherwise an explicit SELECT alias that stands for its key item
    main:
      consumers: [G6]
      name_shapes: [N0]
      producers: [S1]
    local:
      relation: [no-input]
      clause: [select-list, having, order-by]
    cases:
      - key: G6N0S1_11_10
        name: grouping_argument_in_select_list_uses_key_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32, v Int32)"
        runs:
          - sql: "SELECT i + 1 AS k, grouping(k) AS g, sum(v) FROM t GROUP BY GROUPING SETS ((k), ()) ORDER BY g, k"
      - key: G6N0S1_11_11
        name: grouping_argument_in_having_uses_key_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32, v Int32)"
        runs:
          - sql: "SELECT i + 1 AS k, count(*) FROM t GROUP BY GROUPING SETS ((k), ()) HAVING grouping(k) = 0"
      - key: G6N0S1_11_12
        name: grouping_argument_in_order_by_uses_key_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32, v Int32)"
        runs:
          - sql: "SELECT i + 1 AS k, count(*) FROM t GROUP BY GROUPING SETS ((k), ()) ORDER BY grouping(k)"
  - description: a grouping() argument named both by an input column and a SELECT alias is the input column in every clause, a key if the column is one and rejected if only the alias item is
    main:
      consumers: [G6]
      name_shapes: [N0]
      producers: [S1]
    local:
      relation: [input-conflict]
      key_side: [input-column, alias-item]
      clause: [select-list, having, order-by]
    cases:
      - key: G6N0S1_12_000
        name: grouping_argument_in_select_list_prefers_key_column_over_alias
        setup_sqls:
          - "CREATE TABLE t(k UInt64, d String, v Decimal(18,6))"
        runs:
          - sql: "SELECT if(grouping(k)=1, 0, k) AS k, d, sum(v) FROM t GROUP BY GROUPING SETS ((d), (k, d))"
      - key: G6N0S1_12_001
        name: grouping_argument_in_having_prefers_key_column_over_alias
        setup_sqls:
          - "CREATE TABLE t(k UInt64, d String, v Decimal(18,6))"
        runs:
          - sql: "SELECT if(grouping(k)=1, 0, k) AS k, d, sum(v) FROM t GROUP BY GROUPING SETS ((d), (k, d)) HAVING grouping(k) = 0"
      - key: G6N0S1_12_002
        name: grouping_argument_in_order_by_prefers_key_column_over_alias
        setup_sqls:
          - "CREATE TABLE t(k UInt64, d String, v Decimal(18,6))"
        runs:
          - sql: "SELECT if(grouping(k)=1, 0, k) AS k, d, sum(v) FROM t GROUP BY GROUPING SETS ((d), (k, d)) ORDER BY grouping(k), d"
      - key: G6N0S1_12_010
        name: grouping_argument_in_select_list_rejects_column_over_key_alias
        setup_sqls:
          - "CREATE TABLE t(i UInt64, v UInt64)"
        runs:
          - sql: "SELECT i + 1 AS i, grouping(i), sum(v) FROM t GROUP BY GROUPING SETS ((i + 1), ())"
      - key: G6N0S1_12_011
        name: grouping_argument_in_having_rejects_column_over_key_alias
        setup_sqls:
          - "CREATE TABLE t(i UInt64, v UInt64)"
        runs:
          - sql: "SELECT i + 1 AS i, sum(v) FROM t GROUP BY GROUPING SETS ((i + 1), ()) HAVING grouping(i) = 0"
      - key: G6N0S1_12_012
        name: grouping_argument_in_order_by_rejects_column_over_key_alias
        setup_sqls:
          - "CREATE TABLE t(i UInt64, v UInt64)"
        runs:
          - sql: "SELECT i + 1 AS i, sum(v) FROM t GROUP BY GROUPING SETS ((i + 1), ()) ORDER BY grouping(i), i"
  - description: grouping() arguments see only explicit SELECT aliases, as GROUP BY does, also in clauses that resolve implicit item names
    main:
      consumers: [G6]
      name_shapes: [N0]
      producers: [S1]
    local:
      alias_form: [implicit]
      clause: [select-list, having, order-by]
    cases:
      - key: G6N0S1_13_10
        name: grouping_argument_in_select_list_rejects_implicit_item_name
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a + 1, grouping(\"a + 1\") FROM t GROUP BY GROUPING SETS ((a + 1), ())"
      - key: G6N0S1_13_11
        name: grouping_argument_in_having_rejects_implicit_item_name
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a + 1, count(*) FROM t GROUP BY GROUPING SETS ((a + 1), ()) HAVING grouping(\"a + 1\") = 0"
      - key: G6N0S1_13_12
        name: grouping_argument_in_order_by_rejects_implicit_item_name
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT a + 1, count(*) FROM t GROUP BY GROUPING SETS ((a + 1), ()) ORDER BY grouping(\"a + 1\")"
  - description: a grouping() argument that is the alias of an aggregate SELECT item is not a key in any clause
    main:
      consumers: [G6]
      name_shapes: [N0]
      producers: [S2]
    local:
      clause: [select-list, having, order-by]
    cases:
      - key: G6N0S2_14_0
        name: grouping_argument_in_select_list_rejects_aggregate_alias
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT sum(a) AS s, grouping(s) FROM t GROUP BY GROUPING SETS ((b), ())"
      - key: G6N0S2_14_1
        name: grouping_argument_in_having_rejects_aggregate_alias
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT sum(a) AS s, count(*) FROM t GROUP BY GROUPING SETS ((b), ()) HAVING grouping(s) = 0"
      - key: G6N0S2_14_2
        name: grouping_argument_in_order_by_rejects_aggregate_alias
        setup_sqls:
          - "CREATE TABLE t(a Int32, b Int32)"
        runs:
          - sql: "SELECT sum(a) AS s, count(*) FROM t GROUP BY GROUPING SETS ((b), ()) ORDER BY grouping(s)"
  - description: GROUP BY-family main-coordinate closure outside positive coverage obligations
    excluded: true
    reason: this coarse region closes GROUP BY-family main-coordinate coverage; cases here are boundary probes rather than positive coverage obligations
    main:
      consumers: [G0, G1, G2, G3, G4, G5, G6]
      name_shapes: [N0, N1, N2, N3, N4, N5]
      producers: [I0, S0, S1, S2, S3, S4, N0]
    cases:
      - key: G0N3S1_15_
        name: group_by_qualified_complex_does_not_fallback_to_select_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, count(*) FROM t GROUP BY t.k + 1"
      - key: G1N1S1_15_
        name: grouping_sets_qualified_name_does_not_fallback_to_select_alias
        setup_sqls:
          - "CREATE TABLE t(i Int32)"
        runs:
          - sql: "SELECT i AS k, count(*) FROM t GROUP BY GROUPING SETS ((t.k))"
