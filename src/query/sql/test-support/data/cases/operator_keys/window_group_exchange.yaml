name: window_group_exchange
description: "Grouped windows evaluate their shared inputs before distribution."
node_num: 3
sql: |
  SELECT try_cast(d:id AS BIGINT) k, row_number() OVER(PARTITION BY k ORDER BY try_cast(d:ts AS BIGINT)) rn, rank() OVER(PARTITION BY k ORDER BY try_cast(d:ts AS BIGINT) DESC) r FROM key_payload
tables:
  key_payload: operator_keys/payload.sql
  key_dimension: operator_keys/dimension.sql
table_statistics:
  key_payload:
    num_rows: 100000
    data_size: 104857600
    number_of_blocks: 10
    number_of_segments: 1
  key_dimension:
    num_rows: 1000000
    data_size: 16000000
    number_of_blocks: 10
    number_of_segments: 1
