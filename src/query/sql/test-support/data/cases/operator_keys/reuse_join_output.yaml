name: reuse_join_output
description: "A SELECT subexpression reuses the evaluated inner-join key, so its JSON source can die below the join."
node_num: 3
sql: |
  SELECT try_cast(t.d:id AS BIGINT)+1 FROM key_payload t JOIN key_dimension u ON try_cast(t.d:id AS BIGINT)=u.id
tables:
  key_payload: operator_keys/payload.sql
  key_dimension: operator_keys/dimension.sql
table_statistics:
  key_payload:
    num_rows: 100000
    data_size: 104857600
    number_of_blocks: 10
    number_of_segments: 1
  key_dimension:
    num_rows: 1000000
    data_size: 16000000
    number_of_blocks: 10
    number_of_segments: 1
