name: reuse_outer_null_extension
description: "A coalesce key from the null-supplying side must not replace the same SELECT expression."
node_num: 3
sql: |
  SELECT u.id, coalesce(try_cast(t.d:id AS BIGINT),0) FROM key_dimension u LEFT JOIN key_payload t ON u.id=coalesce(try_cast(t.d:id AS BIGINT),0)
tables:
  key_payload: operator_keys/payload.sql
  key_dimension: operator_keys/dimension.sql
table_statistics:
  key_payload:
    num_rows: 100000
    data_size: 104857600
    number_of_blocks: 10
    number_of_segments: 1
  key_dimension:
    num_rows: 1000000
    data_size: 16000000
    number_of_blocks: 10
    number_of_segments: 1
