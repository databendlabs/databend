name: hash_join_runtime_filter
description: "A safe computed probe key retains its scan-level runtime filter after materialization."
node_num: 3
sql: |
  SELECT count(*) FROM key_payload t JOIN key_dimension u ON bit_and(t.id,255)=u.id
tables:
  key_payload: operator_keys/payload.sql
  key_dimension: operator_keys/dimension.sql
table_statistics:
  key_payload:
    num_rows: 1000000
    data_size: 104857600
    number_of_blocks: 10
    number_of_segments: 1
  key_dimension:
    num_rows: 10000
    data_size: 16000000
    number_of_blocks: 10
    number_of_segments: 1
