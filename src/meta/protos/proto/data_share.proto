syntax = "proto3";

package databend_proto;

import "config.proto";

message DataShareMeta {
  uint64 ver = 100;
  uint64 min_reader_ver = 101;

  string provider = 1;
  string name = 2;
  string created_on = 3;
  optional string comment = 4;
  repeated string accounts = 5;
  optional DataShareDatabaseGrant database = 6;
  map<uint64, DataShareTableGrant> tables = 7;
  optional string connection = 8;
}

message DataShareDatabaseGrant {
  uint64 database_id = 1;
  string shared_on = 2;
}

message DataShareTableGrant {
  string shared_on = 1;
  // Provider table storage location without credentials. Credentials are
  // resolved from the share connection at query time.
  optional StorageConfig storage_params = 2;
}
