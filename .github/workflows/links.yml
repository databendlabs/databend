# Temporary manually dispatched probe; published service image is unchanged.
name: v954 Q6 Repeated Read Probe
run-name: v1.2.954-nightly Q6 ten reads, cache zero, Flight reuse off

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v954-q6-repeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  q6-repeat:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/investigation/v954-q6-repeat-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup_bendsql
      - name: Same published v954, same process, Q6 ten times
        uses: ./.github/actions/benchmark_cloud
        with:
          sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}-${{ github.run_attempt }}-q6-repeat
          dataset: tpch1000
          database: tpch_1000
          source: release
          source_id: v1.2.954-nightly
          size: Large
          cache_size: "0"
          tries: "10"
          version: v1.2.954-nightly
          cloud_user: ${{ secrets.BENCHMARK_CLOUD_USER }}
          cloud_password: ${{ secrets.BENCHMARK_CLOUD_PASSWORD }}
          cloud_gateway: ${{ secrets.BENCHMARK_CLOUD_GATEWAY }}
      - name: Verify scope and summarize individual reads
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('benchmark/result-tpch1000-cloud-Large-cache-0.json')
          record = json.loads(path.read_text())
          assert record['version'] == 'v1.2.954-nightly'
          assert record['cache_size'] == '0'
          assert record['tries'] == 10
          assert 'q6-repeat-10-same-process' in record['tags']
          details = record['query_details']
          assert set(details) == {'Q0', 'Q6'}, list(details)
          assert len(details['Q0']) == 1
          assert len(details['Q6']) == 10
          assert all(a['success'] for aa in details.values() for a in aa)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Q6 repeated reads, exact published v954\n'
                      '- One fresh warehouse, same processes/nodes for all attempts\n'
                      '- cache=0; enable_flight_control_channel_reuse=0\n'
                      '- Only Q0 once and Q6 ten times; not a full TPCH report\n'
                      '- Diagnostic SQL is collected only after all ten reads\n'
                      '- First Q6 is not preceded by Q1-Q5; do not compare directly to that sequence\n\n'
                      '| Attempt | Server seconds | Client milliseconds |\n|---|---:|---:|\n')
              for a in details['Q6']:
                  f.write(f"| {a['attempt']} | {a['elapsed_seconds']:.3f} | {a['client_wall_ms']} |\n")
              f.write('\nResults are artifacts only; no official report is overwritten.\n')
          PY
      - name: Keep available diagnostic results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-q6-repeat
          path: |
            benchmark/result-tpch1000-cloud-Large-cache-0*.json
            benchmark/result-tpch1000-cloud-Large-cache-0*.ndjson
          if-no-files-found: ignore
