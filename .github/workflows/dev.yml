name: Dev

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main
      - backport/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'hold-ci' && github.run_id || 'main' }}
  cancel-in-progress: true

jobs:
  changes:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'hold-ci'
    runs-on: ubuntu-latest
    outputs:
      any_src_changed: ${{ steps.src.outputs.any_changed }}
      bendpy_changed: ${{ steps.bendpy.outputs.any_changed }}
      hold_ci: ${{ contains(github.event.pull_request.labels.*.name, 'hold-ci') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Source File Changes
        uses: tj-actions/changed-files@v47
        id: src
        with:
          files_ignore: |
            .github/**
            **.md
            benchmark/**
            docker/**
            scripts/setup/**
            scripts/distribution/**
            .devcontainer/**
      - name: Check Bendpy File Changes
        uses: tj-actions/changed-files@v47
        id: bendpy
        with:
          files: |
            src/bendpy/**
      - name: Output Source File Changes
        run: |
          if [[ "${{ steps.src.outputs.any_changed }}" == "true" ]]; then
            echo "these src files changed:" >> $GITHUB_STEP_SUMMARY
            for line in ${{ steps.src.outputs.all_changed_files }}; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "no src file changes detected" >> $GITHUB_STEP_SUMMARY
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.any_src_changed == 'true' && needs.changes.outputs.hold_ci != 'true'
    uses: ./.github/workflows/reuse.linux.yml
    secrets: inherit
    with:
      build_profile: ci
      runner_provider: aws
      runner_arch: ARM64
      license_type: trial

  mac_check:
    needs: changes
    if: needs.changes.outputs.any_src_changed == 'true' && needs.changes.outputs.hold_ci != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/check_macos
        timeout-minutes: 60

  test_bendpy:
    needs: changes
    if: needs.changes.outputs.bendpy_changed == 'true' && needs.changes.outputs.hold_ci != 'true'
    runs-on:
      - self-hosted
      - ARM64
      - Linux
      - 4c
      - aws
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build_bindings_python
        timeout-minutes: 30
        with:
          target: aarch64-unknown-linux-gnu

  ai_assistance_test:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'hold-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test AI assistance validator
        run: python3 .github/scripts/test_check_pr_ai_assistance.py

  ready:
    if: >-
      always() &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'hold-ci')
    runs-on: ubuntu-latest
    needs:
      - ai_assistance_test
      - changes
      - linux
      - mac_check
      - test_bendpy
    steps:
      - name: Check Ready to Merge
        uses: actions/github-script@v9
        env:
          AI_ASSISTANCE_TEST_RESULT: ${{ needs.ai_assistance_test.result }}
          HOLD_CI: ${{ needs.changes.outputs.hold_ci }}
          SRC_CHANGED: ${{ needs.changes.outputs.any_src_changed }}
          BENDPY_CHANGED: ${{ needs.changes.outputs.bendpy_changed }}
          LINUX_BUILD_RESULT: ${{ needs.linux.result }}
          MAC_CHECK_RESULT: ${{ needs.mac_check.result }}
          BENDPY_RESULT: ${{ needs.test_bendpy.result }}
        with:
          script: |
            if (process.env.HOLD_CI == 'true') {
              core.setFailed('Heavy CI is paused by the hold-ci label; remove hold-ci to run full CI before merging');
              return;
            }
            if (process.env.AI_ASSISTANCE_TEST_RESULT != 'success') {
              core.setFailed(`AI assistance validator tests did not complete successfully (${process.env.AI_ASSISTANCE_TEST_RESULT}), not ready to merge`);
              return;
            }
            if (process.env.SRC_CHANGED == 'false' && process.env.BENDPY_CHANGED == 'false') {
              core.info('No source file changes detected, skipping');
              return;
            }
            if (process.env.BENDPY_CHANGED == 'true' && process.env.BENDPY_RESULT != 'success') {
              core.setFailed(`Bendpy tests did not complete successfully (${process.env.BENDPY_RESULT}), not ready to merge`);
              return;
            }
            if (process.env.SRC_CHANGED == 'false') {
              core.info('Required bendpy checks succeeded, ready to merge');
              return;
            }
            if (process.env.MAC_CHECK_RESULT != 'success') {
              core.setFailed(`macOS check did not complete successfully (${process.env.MAC_CHECK_RESULT}), not ready to merge`);
              return;
            }
            if (process.env.LINUX_BUILD_RESULT == 'success') {
              core.info('Linux build and macOS check succeeded, ready to merge');
              return;
            }
            core.setFailed('Build failed, not ready to merge');
