name: Dev

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - backport/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any_src_changed: ${{ steps.src.outputs.any_changed }}
      bendpy_changed: ${{ steps.bendpy.outputs.any_changed }}
      hold_ci_reason: ${{ steps.hold.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Heavy CI Hold
        id: hold
        uses: actions/github-script@v9
        with:
          script: |
            const { getPRCIHoldReason } = require('./.github/scripts/pr_ci_lifecycle.js');
            core.setOutput('reason', await getPRCIHoldReason(github, context) ?? '');
      # Marker step: ci_timing_comment.js keys off its conclusion to leave
      # the timing report untouched for held runs.
      - name: Heavy CI Paused
        if: steps.hold.outputs.reason != ''
        run: echo "Heavy CI is paused. Remove hold-ci and rerun Dev to resume." >> "$GITHUB_STEP_SUMMARY"
      - name: Check Source File Changes
        uses: tj-actions/changed-files@v47
        id: src
        with:
          files_ignore: |
            .github/**
            **.md
            benchmark/**
            docker/**
            scripts/setup/**
            scripts/distribution/**
            .devcontainer/**
      - name: Check Bendpy File Changes
        uses: tj-actions/changed-files@v47
        id: bendpy
        with:
          files: |
            src/bendpy/**
      - name: Output Source File Changes
        run: |
          if [[ "${{ steps.src.outputs.any_changed }}" == "true" ]]; then
            echo "these src files changed:" >> $GITHUB_STEP_SUMMARY
            for line in ${{ steps.src.outputs.all_changed_files }}; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "no src file changes detected" >> $GITHUB_STEP_SUMMARY
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.any_src_changed == 'true' && needs.changes.outputs.hold_ci_reason == ''
    uses: ./.github/workflows/reuse.linux.yml
    secrets: inherit
    with:
      build_profile: ci
      runner_provider: aws
      runner_arch: ARM64
      license_type: trial

  test_bendpy:
    needs: changes
    if: needs.changes.outputs.bendpy_changed == 'true' && needs.changes.outputs.hold_ci_reason == ''
    runs-on:
      - self-hosted
      - ARM64
      - Linux
      - 4c
      - aws
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build_bindings_python
        timeout-minutes: 30
        with:
          target: aarch64-unknown-linux-gnu

  ai_assistance_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test PR Assistant validators
        run: |
          python3 .github/scripts/test_check_pr_ai_assistance.py
          python3 .github/scripts/test_check_pr_quality.py
      - name: Test PR CI lifecycle
        run: node --test .github/scripts/test_pr_ci_lifecycle.js

  ready:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - ai_assistance_test
      - changes
      - linux
      - test_bendpy
    steps:
      - name: Check Ready to Merge
        uses: actions/github-script@v9
        env:
          AI_ASSISTANCE_TEST_RESULT: ${{ needs.ai_assistance_test.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          HOLD_CI_REASON: ${{ needs.changes.outputs.hold_ci_reason }}
          SRC_CHANGED: ${{ needs.changes.outputs.any_src_changed }}
          BENDPY_CHANGED: ${{ needs.changes.outputs.bendpy_changed }}
          LINUX_BUILD_RESULT: ${{ needs.linux.result }}
          BENDPY_RESULT: ${{ needs.test_bendpy.result }}
        with:
          script: |
            if (process.env.CHANGES_RESULT !== 'success') {
              core.setFailed('Could not determine CI requirements, not ready to merge');
              return;
            }
            if (process.env.HOLD_CI_REASON) {
              const instruction = process.env.HOLD_CI_REASON === 'dependabot'
                ? 'wait for PR Assistant to add hold-ci, then remove it'
                : 'remove hold-ci';
              core.setFailed(`Heavy CI is paused; ${instruction} and rerun all Dev jobs before merging`);
              return;
            }
            if (process.env.AI_ASSISTANCE_TEST_RESULT != 'success') {
              core.setFailed(`AI assistance validator tests did not complete successfully (${process.env.AI_ASSISTANCE_TEST_RESULT}), not ready to merge`);
              return;
            }
            if (process.env.SRC_CHANGED == 'false' && process.env.BENDPY_CHANGED == 'false') {
              core.info('No source file changes detected, skipping');
              return;
            }
            if (process.env.BENDPY_CHANGED == 'true' && process.env.BENDPY_RESULT != 'success') {
              core.setFailed(`Bendpy tests did not complete successfully (${process.env.BENDPY_RESULT}), not ready to merge`);
              return;
            }
            if (process.env.SRC_CHANGED == 'false') {
              core.info('Required bendpy checks succeeded, ready to merge');
              return;
            }
            if (process.env.LINUX_BUILD_RESULT == 'success') {
              core.info('Linux build succeeded, ready to merge');
              return;
            }
            core.setFailed('Build failed, not ready to merge');
