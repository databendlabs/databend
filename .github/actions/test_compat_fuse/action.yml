name: "Test fuse-table format compatibility across query versions"
description: "Run ordered compatibility cases across old and current queries"
inputs:
  runner_provider:
    description: "Self-hosted runner provider, aws or gcp"
    required: true
    default: "aws"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup_license
      with:
        runner_provider: ${{ inputs.runner_provider }}
        type: trial

    - uses: ./.github/actions/setup_test
      with:
        path: ./bins/current/bin
        artifacts: sqllogictests,meta,query

    - name: Test compatibility
      shell: bash
      run: |
        pip install 'PyYAML==6.0.3' -q
        python3 ./tests/compat_fuse/test_compat_fuse.py --run-all
    - name: Upload failure
      if: failure()
      uses: ./.github/actions/artifact_failure
      with:
        name: compat_fuse
