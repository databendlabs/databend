name: "Test sqllogic Stage"
description: "Run the stage sqllogic suite for every dedup/size variant on one standalone deployment"
inputs:
  dirs:
    description: "logic test suites dirs"
    required: true
    default: ""
  handlers:
    description: "logic test handlers, choices: hybrid,http"
    required: true
    default: ""
  storage:
    description: "storage backend for stage, choices: s3,fs"
    required: true
    default: ""
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup_test
      with:
        artifacts: sqllogictests,meta,query

    - uses: ./.github/actions/setup_minio
      with:
        data: true

    # All (dedup, size) variants run against this one deployment.
    - name: Run sqllogic Stage Tests
      shell: bash
      env:
        TEST_HANDLERS: ${{ inputs.handlers }}
        TEST_STAGE_STORAGE: ${{ inputs.storage }}
      run: bash ./scripts/ci/ci-run-sqllogic-tests-stage.sh
