name: "Check"
description: "Check will do all essential checks"
inputs:
  github_token:
    description: "GitHub Token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Build Tool
      uses: ./.github/actions/setup_build_tool
      with:
        bypass_env_vars: RUSTFLAGS,RUST_LOG,GITHUB_TOKEN

    - name: Check Apache License Header
      uses: korandoru/hawkeye@v2
      with:
        config: .config/licenserc.toml

    - name: Check Elastic License Header
      uses: korandoru/hawkeye@v2
      with:
        config: .config/licenserc-ee.toml

    - name: YAML Lint
      shell: bash
      run: make lint-yaml

    - name: Check typos
      shell: bash
      run: typos --config .config/typos.toml

    - name: Format
      shell: bash
      run: cargo fmt --all -- --check

    - name: Check toml format
      shell: bash
      run: |
        taplo check --config .config/taplo.toml
        taplo fmt --config .config/taplo.toml --check

    - name: Clippy
      shell: bash
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
